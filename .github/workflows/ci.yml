name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  client:
    name: Client build & tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build EditorHelper.sln -c Release --nologo

      - name: Tests
        run: dotnet run --project tests/EditorHelper.Tests/EditorHelper.Tests.csproj --nologo
